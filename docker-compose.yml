version: '3.8'

services:
  # 1. ULPF Core API & Web Dashboard
  ulpf-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: ulpf-api
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://ulpf-ai:11434
      - AI_MODEL_NAME=qwen2.5-coder:3b
      - REDPANDA_HOST=redpanda:9092
      - MINIO_HOST=minio:9000
      - OPENSEARCH_HOST=http://opensearch:9200
    depends_on:
      - ulpf-ai
      - redpanda
      - minio
      - opensearch
    restart: unless-stopped

  # 2. Local AI SLM Engine (Ollama + Qwen 3B on RTX 4050 GPU/CPU)
  ulpf-ai:
    build:
      context: .
      dockerfile: Dockerfile.ai
    container_name: ulpf-ai
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    restart: unless-stopped

  # 3. Redpanda (Lightweight C++ Kafka Streaming Buffer - ~400MB RAM)
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.10
    container_name: ulpf-redpanda
    command:
      - redpanda start
      - --smp 1
      - --memory 400M
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "29092:29092"
    restart: unless-stopped

  # 4. MinIO (Immutable Raw Event S3 Object Storage - ~150MB RAM)
  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: ulpf-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ulpf_admin
      MINIO_ROOT_PASSWORD: ulpf_password_2026
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  # 5. OpenSearch (Normalized Search & Analytics Node - Lightweight 512MB JVM Heap)
  opensearch:
    image: opensearchproject/opensearch:2.11.1
    container_name: ulpf-opensearch
    environment:
      - cluster.name=ulpf-cluster
      - node.name=ulpf-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    restart: unless-stopped

  # 6. OpenSearch Dashboards (Analytics & SIEM Visualization Console)
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.11.1
    container_name: ulpf-dashboards
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    depends_on:
      - opensearch
    restart: unless-stopped

volumes:
  ollama_storage:
  minio_data:
  opensearch_data:
