# ==============================================================================
# render.yaml — ULPF Demo Deployment on Render.com
# Free tier: 512MB RAM, HTTP only, spins down after 15min inactivity
# Features: Dashboard, REST API, REST Ingest, Full Pipeline (parse/normalize/AI)
# NOT available on Render free: Syslog UDP/TCP listeners, MinIO, OpenSearch
# ==============================================================================

services:
  - type: web
    name: ulpf-demo
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .

    # Render sets PORT env var automatically; we use it via ULPF_API_PORT
    plan: free          # Change to "starter" ($7/mo) for no sleep + more RAM

    healthCheckPath: /api/v1/health/live

    envVars:
      # ── Core ────────────────────────────────────────────────────────────────
      - key: ULPF_ENV
        value: production
      - key: ULPF_DEBUG
        value: "false"
      - key: ULPF_API_HOST
        value: "0.0.0.0"
      - key: ULPF_API_PORT
        fromService:
          type: web
          name: ulpf-demo
          envVarKey: PORT

      # ── Disable network socket collectors (not supported on Render free) ───
      - key: SYSLOG_UDP_ENABLED
        value: "false"
      - key: SYSLOG_TCP_ENABLED
        value: "false"
      - key: FILE_COLLECTOR_ENABLED
        value: "true"
      - key: FILE_WATCH_DIR
        value: /tmp/ulpf-logs

      # ── Ingestion Queue (keep low for 512MB RAM) ───────────────────────────
      - key: MAX_EVENTS_PER_SECOND
        value: "1000"
      - key: INGRESS_QUEUE_MAX_SIZE
        value: "5000"

      # ── Storage (local only on free tier, no MinIO) ────────────────────────
      - key: MINIO_ENDPOINT
        value: ""         # Empty disables MinIO; app falls back to local storage
      - key: STORAGE_DIR
        value: /tmp/ulpf-raw
      - key: DB_SQLITE_PATH
        value: /tmp/ulpf-metadata.db

      # ── OpenSearch (disabled on free tier) ────────────────────────────────
      - key: OPENSEARCH_URL
        value: ""         # Empty disables OpenSearch

      # ── AI disabled on free (no RAM for Ollama) ───────────────────────────
      - key: AI_ENABLED
        value: "false"
