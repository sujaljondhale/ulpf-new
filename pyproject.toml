[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ulpf"
version = "1.0.0"
description = "Universal Log Pre-processing Framework (ULPF) Enterprise Production (Phase 8)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "psutil>=5.9.8",
]

[tool.pytest.ini_options]
pythonpath = ["main", "."]
testpaths = ["testing/suites"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.pyright]
extraPaths = ["main", "testing", "testing/server"]

