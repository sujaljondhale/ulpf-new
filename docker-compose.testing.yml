services:
  ulpf-simulator:
    build:
      context: .
      dockerfile: Dockerfile.simulator
    container_name: ulpf-simulator
    ports:
      - "8050:8050"
    environment:
      - TESTING_HOST=0.0.0.0
      - TESTING_PORT=8050
      - ANYIO_MAX_THREADS=4
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
